name: Build Driver Loader APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Clean Local Properties & Accept Licenses
        run: |
          rm -f local.properties
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          ./gradlew clean assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log || gradle clean assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Push Build Log to Debug Branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-logs
          cp build.log latest-build.log
          git add latest-build.log
          git commit -m "chore: record build.log" || true
          git push -f origin build-logs

      - name: Check Build Status
        run: |
          if ! ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            echo "ERROR: Release APK was not generated!"
            exit 1
          fi
          echo "SUCCESS: Found APK:"
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload Release Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DriverLoader-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v1.0.9
          name: "NINMODS Kernel Driver Loader v1.0.9 (Non-Blocking UI & Live Permission Settings)"
          body: |
            ## NINMODS Official Release v1.0.9
            - **Non-Blocking Login Flow**:
              - Removed blocking setup screen gate; app launches directly into Login with pre-filled credentials for instant 1-tap entry.
            - **Settings Live Permissions & Root Management**:
              - Users can verify and authorize SuperUser (`su`) and storage permissions directly from Settings anytime.
              - Live root manager detection (APatch, KernelSU, Magisk, SuperUser).
            - **Digital License Countdown Clock**:
              - Real-time digital clock counting down in Hours : Minutes : Seconds (`HH:MM:SS`).
            - **Kernel Driver Selection Dialog**:
              - QX and RT buttons always open official Material 3 Dialog listing kernel-matched driver scripts.
              - "Stop Driver" button enabled strictly when a driver is active.
            - **Simplified Status Cards**:
              - Driver Loader cards strictly display "Not Loaded" / "Working" and "Granted" / "Denied".
            - **Modular Screen Organization**:
              - Dedicated folder for every screen (`login`, `signup`, `forgotpassword`, `dashboard`, `loader`, `settings`, `profile`, `clock`).
            - **Production Signed Release**:
              - Dedicated keystore `ninmods-release.jks` with R8 optimization.
          artifacts: "app/build/outputs/apk/release/*.apk"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
