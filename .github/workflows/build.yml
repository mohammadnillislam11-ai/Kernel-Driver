name: Build Driver Loader APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Clean Local Properties & Accept Licenses
        run: |
          rm -f local.properties
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log
          cp -v app/build/outputs/apk/release/*.apk ./NINMODS-DriverLoader-v1.0.0.apk
          ls -la ./NINMODS-DriverLoader-v1.0.0.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload Release Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DriverLoader-Release
          path: ./NINMODS-DriverLoader-v1.0.0.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v1.0.0
          name: "NINMODS Kernel Driver Loader v1.0.0"
          body: "Official Release v1.0.0: Protected with Google R8/ProGuard Obfuscator, official APatch Jetpack Compose UI architecture, and 410+ Master Kernel Drivers."
          artifacts: "./NINMODS-DriverLoader-v1.0.0.apk"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
