name: Build Driver Loader APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Clean Local Properties & Accept Licenses
        run: |
          rm -f local.properties
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          ./gradlew clean assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log || gradle clean assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Push Build Log to Debug Branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-logs
          cp build.log latest-build.log
          git add latest-build.log
          git commit -m "chore: record build.log" || true
          git push -f origin build-logs

      - name: Check Build Status
        run: |
          if ! ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            echo "ERROR: Release APK was not generated!"
            exit 1
          fi
          echo "SUCCESS: Found APK:"
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload Release Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DriverLoader-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v1.1.2
          name: "NINMODS Kernel Driver Loader v1.1.2 (Universal Reusable Bottom Sheet Architecture)"
          body: |
            ## NINMODS Official Release v1.1.2
            - **Universal Reusable Bottom Sheet (`ui/dialogs/`)**:
              - Created generic `AppSelectionBottomSheet<T>` and `AppCustomBottomSheet` in `com.andorid.ninmods.ui.dialogs`.
              - Reusable across ANY screen for drivers, account switcher, confirmations, and lists.
              - Material 3 `ModalBottomSheet` sliding up from bottom with rounded top (`28.dp`), drag handle, selection radio checkmark, and full-width action button.
            - **100% Real APatch System Integration**:
              - Live POSIX kernel detection (`Os.uname().release`).
              - Real root shell executor (`su` fallback to `/data/adb/ap/bin/su`, `/system/bin/su`, `/data/adb/magisk/su`).
              - Character device node detector inspecting active kernel driver nodes (`/dev/BYNb`, `/dev/mem_tool`, `/dev/nh`, `/dev/wanbai`).
            - **Interactive Status Cards**:
              - Tap SuperUser card to immediately trigger/re-verify root authorization.
              - Tap Kernel Driver card to refresh live device node states.
            - **Live Digital License Countdown Clock**:
              - Real-time digital clock in Hours : Minutes : Seconds (`HH:MM:SS`).
            - **Production Signed Release**:
              - Dedicated keystore `ninmods-release.jks` with R8 optimization.
          artifacts: "app/build/outputs/apk/release/*.apk"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
