name: Build Driver Loader APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Clean Local Properties & Accept Licenses
        run: |
          rm -f local.properties
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          ./gradlew clean assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload Release Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DriverLoader-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Found release APK: $APK_PATH"
          cp "$APK_PATH" NINMODS-DriverLoader-v1.0.0.apk
          gh release upload v1.0.0 NINMODS-DriverLoader-v1.0.0.apk --clobber || \
          gh release create v1.0.0 NINMODS-DriverLoader-v1.0.0.apk \
            --title "NINMODS Kernel Driver Loader v1.0.0" \
            --notes "Official Release v1.0.0: Built with Google R8/ProGuard Obfuscator, APatch UI architecture, and 410+ Master Kernel Drivers."
