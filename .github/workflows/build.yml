name: Build Driver Loader APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Clean Local Properties & Accept Licenses
        run: |
          rm -f local.properties
          yes | sdkmanager --licenses || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          ./gradlew clean assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log || gradle clean assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Push Build Log to Debug Branch
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-logs
          cp build.log latest-build.log
          git add latest-build.log
          git commit -m "chore: record build.log" || true
          git push -f origin build-logs

      - name: Check Build Status
        run: |
          if ! ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            echo "ERROR: Release APK was not generated!"
            exit 1
          fi
          echo "SUCCESS: Found APK:"
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload Release Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DriverLoader-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v1.0.2
          name: "NINMODS Kernel Driver Loader v1.0.2 (Official Release)"
          body: |
            ## NINMODS Official Release v1.0.2
            - **Google Official Code Obfuscator**: R8 & ProGuard enabled.
            - **Master Drivers**: 410+ Kernel Objects integrated.
            - **Minimalist APatch Architecture**: 4 Apps side-by-side dashboard, APatch 2-card driver status, and clean icon navigation bar.
            - **Package**: `com.andorid.ninmods`
          artifacts: "app/build/outputs/apk/release/*.apk"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
